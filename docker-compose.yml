services:
  backend:
    build: ./backend
    container_name: nomod-ai-backend
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-opus-4-7}
      APP_ENV: ${APP_ENV:-development}
      BASE_PAYMENT_URL: ${BASE_PAYMENT_URL:-https://pay.nomod.ai/pay}
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000
    volumes:
      - ./backend/data:/app/data
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    container_name: nomod-ai-frontend
    depends_on:
      - backend
    ports:
      - "3000:80"
