services:
  - type: web
    name: nomod-ai-backend
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CLAUDE_MODEL
        value: claude-opus-4-7
      - key: APP_ENV
        value: production
      - key: BASE_PAYMENT_URL
        value: https://pay.nomod.ai/pay
      - key: CORS_ORIGINS
        value: https://nomod-ai-chat-to-paid.vercel.app,http://localhost:5173
# NOTE: persistent disk is not available on Render's free plan.
# The mock JSON store resets on restart — fine for demo, swap to Postgres for prod.
