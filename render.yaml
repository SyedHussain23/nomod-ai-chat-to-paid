services:
  - type: web
    name: nomod-ai-backend
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CLAUDE_MODEL
        value: claude-opus-4-7
      - key: APP_ENV
        value: production
      - key: BASE_PAYMENT_URL
        value: https://pay.nomod.ai/pay
      - key: CORS_ORIGINS
        value: https://nomod-ai.vercel.app,http://localhost:5173
    disk:
      name: nomod-ai-data
      mountPath: /app/data
      sizeGB: 1
